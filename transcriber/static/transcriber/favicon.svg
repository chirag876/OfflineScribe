<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#111111"/>

  <!-- Microphone body -->
  <rect x="24" y="10" width="16" height="24" rx="8" fill="#ffffff"/>

  <!-- Microphone stand arc -->
  <path d="M18 32 Q18 46 32 46 Q46 46 46 32" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Microphone stand vertical line -->
  <line x1="32" y1="46" x2="32" y2="54" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- Base line -->
  <line x1="24" y1="54" x2="40" y2="54" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- Sound wave dots inside mic -->
  <circle cx="32" cy="28" r="1.5" fill="#111111"/>
  <circle cx="32" cy="23" r="1.5" fill="#111111"/>
  <circle cx="32" cy="18" r="1.5" fill="#111111"/>
</svg>
